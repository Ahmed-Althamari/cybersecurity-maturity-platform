name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Weekly scheduled scan, Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Uploading to the Security tab requires GitHub Advanced Security,
      # which isn't available on a private repo without a paid add-on
      # (confirmed by a failed run: "Code scanning is not enabled for this
      # repository", 403 on the code-scanning API). Not enabling that
      # without asking first. The analysis still runs for real; results
      # are archived as a SARIF artifact instead of uploaded. Switch
      # `upload` back to `always` if/when GHAS gets enabled.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          retention-days: 30

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Fails the job on moderate+ severity findings, per docs/IMPLEMENTATION_STATUS.md
      # security-gate policy. Adjust --audit-level as the threshold is tuned.
      - run: npm audit --audit-level=high

  # actions/dependency-review-action requires GitHub Advanced Security,
  # which isn't available on a private repo without a paid GHAS add-on
  # (confirmed by a failed run: "Dependency review is not supported on
  # this repository"). Not enabling that without asking first — npm audit
  # above plus Dependabot (dependabot.yml) already cover this need for
  # free. Revisit if the repo goes public or GHAS gets purchased.

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.17.9
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90
