name: Container Security

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/Dockerfile.*'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'services/data-analysis/**'
  schedule:
    # Weekly scheduled scan, Monday 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: infrastructure/Dockerfile.api
          - image: web
            context: .
            dockerfile: infrastructure/Dockerfile.web
          - image: data-analysis
            context: services/data-analysis
            dockerfile: services/data-analysis/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: cmmp-${{ matrix.image }}:ci
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cmmp-${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      # Uploading to the Security tab requires GitHub Advanced Security,
      # which isn't available on this private repo without a paid add-on
      # (see the same note in security.yml's CodeQL job). Archiving as an
      # artifact instead until that's enabled.
      - uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.image }}-sarif
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 30
