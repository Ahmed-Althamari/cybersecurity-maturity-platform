name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches new CodeQL query-pack findings against unchanged code, not
    # just what changed in a given PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # codeql-action/analyze looks up the current workflow run via the API
  # (for check-run association) -- without this it fails with "Resource
  # not accessible by integration", confirmed against this repo's own
  # Actions runs before this permission was added.
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: CodeQL's JS/TS extractor works directly from source
      # (it doesn't need compiled output the way the Java/C++ extractors do).
      #
      # upload: never -- the Security tab's code-scanning upload requires
      # GitHub Advanced Security, unavailable on a private repo without a
      # paid add-on (confirmed: "Code scanning is not enabled for this
      # repository", 403 from the code-scanning API on this exact repo).
      # The analysis still runs for real; results are archived as a SARIF
      # artifact instead. Flip back to "always" if GHAS gets enabled.
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: sarif-results

      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30
