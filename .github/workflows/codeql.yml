name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches new CodeQL query-pack findings against unchanged code, not
    # just what changed in a given PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # No build step: CodeQL's JS/TS extractor works directly from source
      # (it doesn't need compiled output the way the Java/C++ extractors do).
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
