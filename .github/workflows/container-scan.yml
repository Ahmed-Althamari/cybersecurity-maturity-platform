name: Container Scan & SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-scan-sbom:
    name: Build, scan & SBOM (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infrastructure/Dockerfile.api
          - image: web
            dockerfile: infrastructure/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Both Dockerfiles build from the repo root (see the comment at the
      # top of each) -- a monorepo workspace's dist/ depends on its sibling
      # packages' dist/, so the build context can't be scoped to just
      # apps/api or apps/web.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cmmp-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image (Trivy)
        # Pinned to a commit SHA, not a mutable version tag, per GHSA-69fq-xp46-6x23:
        # a March 2026 supply-chain compromise force-pushed 76 of 77 trivy-action
        # version tags (everything below 0.35.0) to malware-injected commits. This
        # SHA is tag 0.35.0, the first version GitHub's immutable-releases
        # protection covers (confirmed unaffected by the hijack) -- see the
        # Dependabot alert this fixed (dependabot/alerts) for the incident this
        # was caught by.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: cmmp-${{ matrix.image }}:ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: "CRITICAL,HIGH"
          # Report but don't fail the build on findings until the baseline
          # has actually been triaged once -- see Known Issues in
          # docs/IMPLEMENTATION_STATUS.md. Flip to "1" once that's done.
          exit-code: "0"

      # Uploading to the Security tab requires GitHub Advanced Security,
      # unavailable on a private repo without a paid add-on (same 403
      # confirmed for codeql.yml's upload -- see that file's comment).
      # Archiving as an artifact instead; switch back to upload-sarif if
      # GHAS gets enabled.
      - name: Archive Trivy SARIF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}-sarif
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 30

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0.17.2
        with:
          image: cmmp-${{ matrix.image }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          retention-days: 90

  sbom-dependencies:
    name: SBOM (npm dependency tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Covers the source-level dependency tree (all workspaces' deps) as a
      # CycloneDX SBOM, complementing the two image-level SBOMs above which
      # only cover what actually ships in each container.
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-dependencies.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-dependencies
          path: sbom-dependencies.cdx.json
          retention-days: 90
