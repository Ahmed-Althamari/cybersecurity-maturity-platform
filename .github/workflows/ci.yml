name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  # Matches infrastructure/Dockerfile.*, docker-compose.yml, and this
  # session's own local Postgres -- kept in one place so it's obvious the
  # whole pipeline agrees on one Postgres major version.
  POSTGRES_IMAGE: postgres:15-alpine

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # @cmmp/database re-exports the generated Prisma Client, so every
      # workspace's type-check fails without it -- generating needs no live
      # database.
      - run: npm run db:generate

      - run: npm run lint
      - run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate

      # `npm test` (root "test" script, turbo run test) runs every
      # workspace's own fully-mocked unit suite -- no live database needed.
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build

  integration-tests:
    name: Integration Tests (live DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cmmp_user
          POSTGRES_PASSWORD: cmmp_password
          POSTGRES_DB: cmmp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmmp_user -d cmmp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public
      DIRECT_DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public
      JWT_SECRET: ci-jwt-secret-not-for-production-min-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      # The integration suite logs in as the seeded demo tenant's users
      # (ciso@example.local, viewer@example.local) -- without this they
      # don't exist and every login in the suite fails.
      - run: npm run db:seed

      # See apps/api/test/tenant-security.integration-spec.ts -- boots the
      # real AppModule (nothing mocked) against the service container above.
      - run: npm run test:integration --workspace=@cmmp/api

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cmmp_user
          POSTGRES_PASSWORD: cmmp_password
          POSTGRES_DB: cmmp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmmp_user -d cmmp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public
      DIRECT_DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public
      JWT_SECRET: ci-jwt-secret-not-for-production-min-32-chars
      NEXTAUTH_SECRET: ci-nextauth-secret-not-for-production-min-32-chars
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer entries start both the api and web
      # dev servers themselves (reuseExistingServer keeps this idempotent),
      # so no manual background-process wrangling is needed here.
      - name: Run Playwright E2E suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  security-gate:
    name: Security Gate
    if: always()
    needs:
      [lint-and-typecheck, unit-tests, build, integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job above to have succeeded
        run: |
          echo "lint-and-typecheck: ${{ needs.lint-and-typecheck.result }}"
          echo "unit-tests:         ${{ needs.unit-tests.result }}"
          echo "build:               ${{ needs.build.result }}"
          echo "integration-tests:   ${{ needs.integration-tests.result }}"
          echo "e2e-tests:           ${{ needs.e2e-tests.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks failed."
            exit 1
          fi
