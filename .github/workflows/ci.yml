name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx turbo run test -- --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: apps/api/coverage
          retention-days: 14

  python-tests:
    name: Python Tests (data-analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      # Matches services/data-analysis/Dockerfile's runtime image exactly (python:3.11-slim +
      # this one system package) so the versions pytest runs against here are the ones actually
      # shipped, not just whatever happens to resolve on the runner's default Python.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: pip install -r requirements.txt
        working-directory: services/data-analysis
      - run: pytest
        working-directory: services/data-analysis

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build

  e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmmp_user
          POSTGRES_PASSWORD: cmmp_password
          POSTGRES_DB: cmmp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmmp_user -d cmmp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public
      JWT_SECRET: ci-e2e-secret-not-for-production-min-32-chars
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Encrypts tenant-saved LLM provider API keys at rest (apps/api/src/llm-settings).
      # Generated fresh per run rather than a fixed value committed here, which a secret scanner
      # would (correctly) flag as a high-entropy key-shaped literal even though it's not a real
      # secret — this way there's nothing hardcoded to flag.
      - run: echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run db:generate
      # apps/api/test/*.e2e-spec.ts boots the real AppModule against this service container —
      # real PrismaService, real JwtModule, the real global AuditInterceptor — via supertest.
      # Each spec file creates and tears down its own isolated Tenant/Organisation/User (there's
      # no tenant-creation API), so this is safe to run against a shared service container.
      - run: cd packages/database && npx prisma migrate deploy
      - run: npm run test:e2e

  web-e2e:
    name: Web E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cmmp_user
          POSTGRES_PASSWORD: cmmp_password
          POSTGRES_DB: cmmp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmmp_user -d cmmp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public
      JWT_SECRET: ci-e2e-secret-not-for-production-min-32-chars
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-e2e-nextauth-secret-not-for-production-min-32-chars
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      DEMO_USER_PASSWORD: DemoPassword123!
      # apps/api/src/data-analysis/data-analysis.service.ts defaults to this same value when the
      # var is unset, but naming it explicitly here documents that this job depends on the
      # data-analysis service being started (below) at exactly this address.
      DATA_ANALYSIS_SERVICE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      # Encrypts tenant-saved LLM provider API keys at rest (apps/api/src/llm-settings).
      # Generated fresh per run rather than a fixed value committed here, which a secret scanner
      # would (correctly) flag as a high-entropy key-shaped literal even though it's not a real
      # secret — this way there's nothing hardcoded to flag.
      - run: echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run db:generate
      - run: cd packages/database && npx prisma migrate deploy
      # Seeds the demo tenant/organisation/users (admin@example.local, ciso@example.local,
      # viewer@example.local, ...) that apps/web/e2e/global-setup.ts signs in as.
      - run: npm run db:seed
      - run: npx turbo run build --filter=@cmmp/api... --filter=@cmmp/web
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      # data-analysis-*.spec.ts (dashboard-sheet extraction, slot picker) upload real workbooks
      # through the actual NestJS proxy — that proxy has no fallback if this service isn't
      # reachable at DATA_ANALYSIS_SERVICE_URL, so it has to be up before Playwright starts, same
      # as the API/web servers below.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
      - run: pip install -r requirements.txt
        working-directory: services/data-analysis
      - name: Start the data-analysis service
        working-directory: services/data-analysis
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/data-analysis.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "data-analysis service did not become healthy in time"; cat /tmp/data-analysis.log; exit 1
      # playwright.config.ts's webServer entries start `node dist/main` (apps/api) and
      # `npm run start` (apps/web, i.e. `next start`) against the builds from the step above —
      # this is a real browser driving two real HTTP servers against the real Postgres and
      # data-analysis services above, not a mocked stack.
      - run: npm run test:e2e --workspace=@cmmp/web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
