name: DAST

# Intentionally NOT wired to pull_request/push: a ZAP baseline scan is slow
# and noisy enough that it doesn't belong gating every PR — it belongs
# nightly against a real deployed target rather than a docker-compose-in-CI
# approximation. (The API now has a real /health endpoint and a generated
# migration, per Phase 15/2 of docs/IMPLEMENTATION_STATUS.md, so the
# compose-in-CI approximation below is at least no longer blocked on
# missing prerequisites — the design choice to keep this schedule/manual-
# dispatch-only stands regardless.)
on:
  schedule:
    # Nightly, 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run db:generate

      # Encrypts tenant-saved LLM provider API keys at rest (apps/api/src/llm-settings) —
      # required by docker-compose.yml's api service below. Generated fresh per run rather than a
      # fixed value committed here, which a secret scanner would (correctly) flag as a
      # high-entropy key-shaped literal even though it's not a real secret.
      - run: echo "SETTINGS_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start stack
        run: docker compose up -d --build
        env:
          # Non-production, CI-only values — never used outside this ephemeral run.
          JWT_SECRET: ci-dast-secret-not-for-production-min-32-chars
          NEXTAUTH_SECRET: ci-dast-secret-not-for-production-min-32-chars

      - name: Wait for API to be reachable
        # /api/v1 alone (no further path) 404s — no controller registers the bare prefix root — so
        # `curl -sf` against it can never succeed regardless of API health. Use the real /health
        # endpoint instead (unauthenticated, checks actual DB connectivity, added in Phase 15).
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become reachable in time"
          docker compose logs
          exit 1

      - name: Run database migrations and seed
        run: |
          cd packages/database
          npx prisma migrate deploy
          npm run seed
        env:
          DATABASE_URL: postgresql://cmmp_user:cmmp_password@localhost:5432/cmmp_db?schema=public

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3001/api/v1'
          cmd_options: '-a'
          fail_action: false

      - name: Stop stack
        if: always()
        run: docker compose down -v
