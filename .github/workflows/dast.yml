name: DAST (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (Postgres + api + web)
        env:
          JWT_SECRET: dast-jwt-secret-not-for-production-min-32-chars
          NEXTAUTH_SECRET: dast-nextauth-secret-not-for-production-min-32-chars
        # `up -d` runs detached, so a crashing container's own stdout/stderr
        # is otherwise never captured before the job tears the stack down --
        # dump every service's logs on failure so the real crash reason is
        # visible instead of just "container cmmp-api exited (1)".
        run: |
          docker compose up -d --build || {
            echo "::group::docker compose logs"
            docker compose logs
            echo "::endgroup::"
            exit 1
          }

      - name: Wait for the web app to be reachable
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/auth/signin > /dev/null 2>&1; then
              echo "web is up"
              exit 0
            fi
            sleep 5
          done
          echo "web never became reachable"
          docker compose logs
          exit 1

      # Baseline = passive scan only (spiders the app, checks response
      # headers/cookies/etc.) -- it never submits forms or attempts
      # exploitation, so it's safe to run against a real (seeded or not)
      # instance in CI. An authenticated, active scan is a heavier follow-up
      # this phase deliberately doesn't take on (see docs/IMPLEMENTATION_STATUS.md).
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          # Fails the job on any WARN/FAIL rule rather than only on ZAP's
          # own internal errors (action-baseline's default).
          cmd_options: "-a"
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 14

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
