services:
  postgres:
    image: postgres:15-alpine
    container_name: cmmp-postgres
    environment:
      POSTGRES_USER: cmmp_user
      POSTGRES_PASSWORD: cmmp_password
      POSTGRES_DB: cmmp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmmp_user -d cmmp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cmmp-network

  api:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.api
    container_name: cmmp-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cmmp_user:cmmp_password@postgres:5432/cmmp_db?schema=public
      DIRECT_DATABASE_URL: postgresql://cmmp_user:cmmp_password@postgres:5432/cmmp_db?schema=public
      # Docker Compose auto-loads a root .env (see .env.example) and
      # substitutes it here; the fallback after ':-' only applies if that
      # file/variable is absent -- never commit a real secret to this file.
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-min-32-chars}
      CORS_ORIGIN: http://localhost:3000
      # Both optional -- unset means "that feature is off" (AI-assisted
      # import mapping unavailable / settings-UI key storage unavailable),
      # not an error. See .env.example.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # Login brute-force protection -- code defaults (60s / 20 attempts)
      # apply if left unset, matching .env.example.
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-}
      # Generic, API-wide per-IP request budget (GlobalRateLimitGuard) --
      # code defaults (15min / 100 requests) apply if left unset.
      ENABLE_RATE_LIMITING: ${ENABLE_RATE_LIMITING:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-}
    ports:
      - "3001:3001"
    # Applies pending Prisma migrations before every start -- safe to run on
    # every boot (a no-op once the schema is current) and keeps a fresh
    # `docker compose up` on an empty postgres volume self-sufficient.
    command: sh -c "npx prisma migrate deploy --schema packages/database/prisma/schema.prisma && node apps/api/dist/main.js"
    networks:
      - cmmp-network

  web:
    build:
      context: .
      dockerfile: ./infrastructure/Dockerfile.web
    container_name: cmmp-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Browser-facing: the user's browser reaches the api container through
      # its published host port, not the internal Docker network.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server-side only (see pages/api/auth/[...nextauth].ts): NextAuth's
      # credentials callback runs inside this container, so it must use the
      # compose service DNS name, not the host-facing URL above.
      INTERNAL_API_URL: http://api:3001
      NEXTAUTH_URL: http://localhost:3000
      # Same substitution mechanism as JWT_SECRET above.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-nextauth-secret-change-in-production-min-32-chars}
    ports:
      - "3000:3000"
    networks:
      - cmmp-network

volumes:
  pgdata:
    driver: local

networks:
  cmmp-network:
    driver: bridge
